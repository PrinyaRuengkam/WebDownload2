<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>YouTube Downloader</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .file-list {
            margin-top: 20px;
            text-align: left;
        }

        .file-list ul {
            list-style-type: none;
            padding: 0;
        }

        .file-list li {
            margin: 5px 0;
        }

        .file-list a {
            color: #4CAF50;
            text-decoration: none;
        }

        .file-list a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>YouTube Downloader</h1>
        <input type="text" id="url" placeholder="Enter YouTube URL">
        <select id="format">
            <option value="mp4">MP4 (Video)</option>
            <option value="mp3">MP3 (Audio)</option>
        </select>
        <button onclick="startDownload()">Download</button>
        <div class="progress-container">
            <div id="progress-bar"></div>
        </div>
        <p id="status">Waiting...</p>
        <a id="download-link" href="#" style="display: none;" download>Download File</a>
        <div class="file-list">
            <h2>Downloaded Files</h2>
            <ul id="file-list"></ul>
        </div>
    </div>
    <script>
        const backendUrl = "https://your-backend-url.com"; // URL ของ Backend (เช่น Render หรือ Vercel)

        function startDownload() {
            const url = document.getElementById('url').value;
            const format = document.getElementById('format').value;

            fetch(`${backendUrl}/download`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ url, format }),
            })
            .then(response => {
                if (response.ok) {
                    document.getElementById('status').innerText = "Download started!";
                } else {
                    document.getElementById('status').innerText = "Error starting download.";
                }
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('status').innerText = "Error connecting to server.";
            });
        }

        function loadFileList() {
            fetch('/list_files')
                .then(res => res.json())
                .then(files => {
                    const fileList = document.getElementById('file-list');
                    fileList.innerHTML = ''; // ล้างรายการเก่า
                    files.forEach(file => {
                        const li = document.createElement('li');
                        const link = document.createElement('a');
                        link.href = '/download_file/' + file;
                        link.textContent = file;
                        link.download = file;
                        li.appendChild(link);
                        fileList.appendChild(li);
                    });
                });
        }

        // เรียกใช้ฟังก์ชันเมื่อโหลดหน้าเว็บ
        window.onload = loadFileList;
    </script>
</body>
</html>
